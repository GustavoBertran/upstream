name: upstream
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # QC (all tracks)
  - fastqc=0.12.1
  - multiqc=1.21
  - fastp=0.23.4
  # RNA-seq
  - star=2.7.11a
  - salmon=1.10.3
  - samtools=1.21
  # ATAC-seq
  - bowtie2=2.5.4
  - macs2=2.2.9.1
  - deeptools=3.5.5
  # Methylation
  - bismark=0.24.2
  # Shared utilities
  - seqtk=1.4
  - pip
  - pip:
    - typer>=0.9.0
    - rich>=13.7.0
    - fastapi>=0.110.0
    - uvicorn>=0.27.0
    - "."
