[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upstream"
version = "0.1.0"
description = "HTS preprocessing pipeline — trim, align, quantify, and produce OBAMA-format matrices"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
upstream = "upstream.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
upstream = ["content/**/*.md"]
